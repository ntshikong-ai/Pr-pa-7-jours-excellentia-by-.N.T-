.header {

}

    font-weight: bold;

.timer {
    background: #ffe5e5;

}

.progress {
    height: 8px;
    background: #ddd;
    border-radius: 5px;

    margin-bottom: 20px;
}

.progress-bar {
    height: 100%;
    background: #1769aa;
    width: 0%;
    transition: width 0.3s;
}

.question-number {
    color: #666;
    font-size: 14px;
    margin-bottom: 12px;
}

.question {
    font-size: 19px;
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 20px;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.option {
    width: 100%;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 9px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.option:hover {
    background: #eef6ff;
    border-color: #1769aa;
}

.option.selected {
    background: #dceeff;
    border: 2px solid #1769aa;
}

.next-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #16803c;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.next-btn:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.result {
    text-align: center;
}

.score {
    font-size: 38px;
    font-weight: bold;
    margin: 20px;
}

.result button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #1769aa;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin-top: 10px;
}

.review {
    margin-top: 25px;
    text-align: left;
}

.review-item {
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 8px;
    background: #f5f5f5;
}

.correct {
    border-left: 5px solid #16803c;
}

.incorrect {
    border-left: 5px solid #c62828;
}

.hidden {
    display: none;
}
</style>
</head>

let current = 0;
let score = 0;
let selected = null;
let time = 45;
let timer = null;
let answers = [];

const questionElement = document.getElementById("question");
const optionsElement = document.getElementById("options");
const subjectElement = document.getElementById("subject");
const numberElement = document.getElementById("number");
const timeElement = document.getElementById("time");
const nextButton = document.getElementById("nextButton");
const progressBar = document.getElementById("progressBar");

function startTimer() {

    clearInterval(timer);

    time = 45;
    timeElement.textContent = time;

    timer = setInterval(() => {

        time--;

        timeElement.textContent = time;

        if (time <= 0) {

            clearInterval(timer);

            answers.push({
                question: questions[current].question,
                selected: null,
                correct: questions[current].options[questions[current].answer],
                isCorrect: false
            });

            current++;

            loadQuestion();
        }

    }, 1000);
}

function loadQuestion() {

    if (current >= questions.length) {
        finishQuiz();
        return;
    }

    selected = null;
    nextButton.disabled = true;

    const q = questions[current];

    subjectElement.textContent = q.subject;

    numberElement.textContent =
        `Question ${current + 1} sur ${questions.length}`;

    questionElement.textContent = q.question;

    progressBar.style.width =
        `${(current / questions.length) * 100}%`;

    optionsElement.innerHTML = "";

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) + ". " + option;

        button.onclick = () => selectAnswer(index, button);

        optionsElement.appendChild(button);
    });

    startTimer();
}

function selectAnswer(index, button) {

    selected = index;

    document.querySelectorAll(".option")
        .forEach(btn => btn.classList.remove("selected"));

    button.classList.add("selected");

    nextButton.disabled = false;
}

nextButton.onclick = () => {

    if (selected === null) return;

    clearInterval(timer);

    const q = questions[current];

    const correct = selected === q.answer;

    if (correct) score++;

    answers.push({
        question: q.question,
        selected: q.options[selected],
        correct: q.options[q.answer],
        isCorrect: correct
    });

    current++;

    loadQuestion();
};

function finishQuiz() {

    clearInterval(timer);

    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.remove("hidden");

    document.getElementById("finalScore")
        .textContent = score;

    const percentage =
        Math.round((score / questions.length) * 100);

    document.getElementById("percentage")
        .textContent = percentage + "%";

    let message = "";

    if (percentage >= 90) {
        message = "Excellent résultat.";
    } else if (percentage >= 80) {
        message = "Très bon résultat. Continuez la préparation.";
    } else if (percentage >= 70) {
        message = "Bon résultat. Il reste des points à renforcer.";
    } else if (percentage >= 60) {
        message = "Résultat moyen. Une révision supplémentaire est nécessaire.";
    } else {
        message = "Continuez à travailler et analysez vos erreurs.";
    }

    document.getElementById("message")
        .textContent = message;
}

function showReview() {

    const review = document.getElementById("review");

    review.classList.remove("hidden");

    review.innerHTML = "<h3>Correction</h3>";

    answers.forEach((answer, index) => {

        const div = document.createElement("div");

        div.className =
            "review-item " +
            (answer.isCorrect ? "correct" : "incorrect");

        div.innerHTML = `
            <strong>Question ${index + 1}</strong><br><br>
            ${answer.question}<br><br>

            <strong>Votre réponse :</strong>
            ${answer.selected === null ? "Aucune réponse" : answer.selected}
            <br>

            <strong>Bonne réponse :</strong>
            ${answer.correct}
        `;

        review.appendChild(div);
    });
}

function restartQuiz() {
    location.reload();
}

loadQuestion();

</script>
